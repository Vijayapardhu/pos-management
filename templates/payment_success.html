{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card text-center">
                <div class="card-body py-5">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                    </div>
                    
                    <h3 class="text-success mb-3">Payment Successful!</h3>
                    <p class="text-muted mb-4">Bill #{{ bill.id }} has been paid</p>
                    
                    <div class="card bg-light mb-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Customer:</span>
                                <strong>{{ bill.customer.name }}</strong>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Date:</span>
                                <strong>{{ bill.bill_date.strftime('%d-%b-%Y %H:%M') }}</strong>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Total Amount:</span>
                                <strong class="text-primary">₹{{ "%.2f"|format(bill.total_amount) }}</strong>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <a href="/bill/{{ bill.id }}/print" class="btn btn-primary">
                            <i class="bi bi-printer me-2"></i>Print Receipt
                        </a>
                        <a href="/pos" class="btn btn-success">
                            <i class="bi bi-cart-plus me-2"></i>New Sale
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
window.onload = function() {
    setTimeout(function() {
        window.print();
    }, 500);
};
</script>
{% endblock %}
